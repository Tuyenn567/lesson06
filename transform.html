<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a{
            width: 120px;
            height: 50px;
            background-color: pink;
            transform: rotate(20deg);
        }
    </style>
    <style>
        .b{
            width: 120px;
            height: 50px;
            background-color: pink;
            transform: skew(20deg);
        }
    </style>
    <style>
        .c{
            width: 120px;
            height: 50px;
            background-color: pink;
            transform: scale(1.5);
        }
    </style>
    <style>
        .d{
            width: 120px;
            height: 50px;
            background-color: pink;
            transform: translateX(100%);
        }
    </style>
</head>
<body>
    <h2>transform: rotate(20deg)</h2>
    <div class="a">rotate - xoay</div>
    <h2>transform: skewY(20deg)</h2>
    <div class="b">skew - nghiêng</div>
    <h2>transform: scale(1.5)</h2>
    <div class="c">scale - phóng to</div>
    <h2>transform: translateX(100%)</h2>
    <div class="d">translateX - di chuyển vị trí </div>
</body>
</html>
